<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success | Rakeshsharma</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .success-card {
            background: rgba(22, 12, 43, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 4rem 3rem;
            text-align: center;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .success-icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.15);
            /* Emerald tint */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: #10B981;
        }

        .success-icon-wrapper i {
            width: 40px;
            height: 40px;
        }

        .success-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        .success-desc {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="background-effects" style="opacity: 0.5;">
        <div class="orb orb-1" style="background: radial-gradient(circle, #10B981 0%, transparent 70%);"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="success-page">
        <div class="success-card">
            <div class="success-icon-wrapper">
                <i data-lucide="check"></i>
            </div>
            <h1 class="success-title">Form submitted successfully!</h1>
            <p class="success-desc">
                Thank you for reaching out to me. <br>
                I'll review your submission and get back to you soon.
            </p>
            <a href="index.html" class="btn btn-outline" style="padding: 1rem 2rem;">
                <i data-lucide="arrow-left" style="width: 18px; height: 18px; margin-right: 8px;"></i> Go Back
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
